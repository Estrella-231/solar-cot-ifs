  <text x="400.0" y="101.0" font-size="25" fill="#A55A21" text-anchor="middle">左：较早负结果｜预报域训练的单帧头</text>
  <text x="1200.0" y="101.0" font-size="25" fill="#087F78" text-anchor="middle">右：最新正结果｜同期训练的三帧头冻结回放</text>
