  <text x="800.0" y="426.0" font-size="23" fill="#263238" text-anchor="middle">② 验证时实际怎样预报</text>
  <text x="800.0" y="822.0" font-size="23" fill="#263238" text-anchor="middle">③ 各自共同样本中的结果（RMSE，W/m²）</text>
  <text x="800.0" y="1044.0" font-size="23" fill="#263238" text-anchor="middle">已核实同时变化：上游训练范围与权重、GHI训练域、1帧/3帧、评价样本</text>
  <text x="800.0" y="1091.0" font-size="22" fill="#263238" text-anchor="middle">因此：新结果支持该配置的验证增益，不能单独归因于“三帧”或“修正R”。</text>
  <text x="800.0" y="1129.0" font-size="19" fill="#61717C" text-anchor="middle">两者均为开发验证；不是独立测试。图示不表示不同实验使用同一套S/R/GHI权重。</text>
