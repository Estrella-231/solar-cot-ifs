  <rect x="905.0" y="559.0" width="590.0" height="92.0" fill="#F6F8FA" stroke="#BAC3CA" stroke-width="2" rx="8"/>
  <text x="1200.0" y="600.7" font-size="22" fill="#263238" text-anchor="middle" font-weight="bold">预测AGRI → 全train修正R → 未来COT</text>
  <text x="1200.0" y="624.7" font-size="22" fill="#263238" text-anchor="middle" font-weight="bold">与同一时序的预测AGRI逐像元对齐</text>
  <rect x="105.0" y="693.0" width="590.0" height="78.0" fill="#FFF8F0" stroke="#CF9B6A" stroke-width="2" rx="8"/>
